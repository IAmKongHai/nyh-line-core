[program:line-fd-smart-submit]
; 部署时把 directory 改成这台机器上 nyh-line-core 的路径
command=python -m nyh_line fd-smart submit
directory=/opt/nyh-line-core
stopasgroup=true
killasgroup=true
stopwaitsecs=60
autostart=false
autorestart=true
redirect_stderr=true
stdout_logfile=/opt/nyh-line-core/logs/line-fd-smart-submit.log
