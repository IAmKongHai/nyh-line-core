[program:line-vtsi-globe-submit]
; 部署目录占位为 /opt/nyh-line-core。换目录时 command、directory、stdout_logfile 三处一起改。
; 解释器必须是仓库里 .venv 的 python，且包以 pip install -e . 可编辑安装，见 README「部署」。
command=/opt/nyh-line-core/.venv/bin/python -m nyh_line vtsi-globe submit
directory=/opt/nyh-line-core
environment=PYTHONUNBUFFERED="1"
stopasgroup=true
killasgroup=true
stopwaitsecs=60
autostart=false
autorestart=true
redirect_stderr=true
stdout_logfile=/opt/nyh-line-core/logs/line-vtsi-globe-submit.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
