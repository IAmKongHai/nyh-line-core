[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nyh-line-core"
version = "0.1.0"
description = "南亚汇六条充值线路的独立工人"
requires-python = ">=3.13"
dependencies = [
    "requests>=2.31",
    "legacy-cgi",
    "zeep>=4.1,<4.2",
    "lxml",
    "xmltodict",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
